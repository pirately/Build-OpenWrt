name: Build_OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:

concurrency:
  group: build-openwrt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
    - name: Checkout Projects
      uses: actions/checkout@main

      with:
        persist-credentials: false

    - name: Load Settings.ini
      run: |
        source "${GITHUB_WORKSPACE}/settings/settings.ini"
        {
          echo "WRT_REPO=${WRT_REPO}"
          echo "WRT_BRANCH=${WRT_BRANCH}"
          echo "WRT_TARGET=${WRT_TARGET}"
          echo "WRT_THEME=${WRT_THEME}"
          echo "WRT_NAME=${WRT_NAME}"
          echo "WRT_PLUGIN=${WRT_PLUGIN}"
          echo "UPLOAD_FIRMWARE=${UPLOAD_FIRMWARE}"
          echo "UPLOAD_RELEASE=${UPLOAD_RELEASE}"
          echo "INFORMATION_NOTICE=${INFORMATION_NOTICE}"
          echo "ENABLE_ADGUARDHOME=$ENABLE_ADGUARDHOME"
          echo "ENABLE_DL_CACHE=${ENABLE_DL_CACHE}"
          echo "ENABLE_CCACHE=${ENABLE_CCACHE}"
          echo "CCACHE_SIZE=${CCACHE_SIZE}"
          echo "ARTIFACT_RETENTION_DAYS=${ARTIFACT_RETENTION_DAYS}"
        } >> $GITHUB_ENV

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 清理 Runner 预装的大体积冗余软件，释放 15GB+ 空间防止编译爆盘
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/*
        sudo apt-get -yqq update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential bzip2 ca-certificates ccache clang \
          cmake cpio curl device-tree-compiler dos2unix file flex \
          g++-multilib gawk gcc-multilib genisoimage gettext git jq \
          libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
          llvm ninja-build patch perl pkgconf python3 python3-cryptography \
          python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
          unzip wget xz-utils zlib1g-dev zstd

        sudo apt-get -yqq autoremove --purge && sudo apt-get -yqq clean
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Initialization Values
      run: |
        WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M")
        WRT_TIME=$(TZ=UTC-8 date +%Y.%m.%d)
        WRT_SOURCE=$(echo "$WRT_REPO" | cut -d '/' -f 5-)
        WRT_VER="${WRT_SOURCE}-${WRT_BRANCH}"
        WRT_TYPE=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "./config/${WRT_TARGET}.config" | tr '[:lower:]' '[:upper:]')

        # 自动获取 Runner 系统及版本
        source /etc/os-release
        RUNNER_OS_VERSION="${ID}-${VERSION_ID}"

        {
          echo "WRT_DATE=$WRT_DATE"
          echo "WRT_TIME=$WRT_TIME"
          echo "WRT_SOURCE=$WRT_SOURCE"
          echo "WRT_VER=$WRT_VER"
          echo "WRT_TYPE=$WRT_TYPE"
          echo "RUNNER_OS_VERSION=$RUNNER_OS_VERSION"
        } >> "$GITHUB_ENV"

    - name: Clone Source Code
      run: |
        git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./openwrt

        cd ./openwrt/
        echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

        # 移除国内镜像源，避免 GitHub 服务器拉取超时
        PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
        if [ -f "$PROJECT_MIRRORS_FILE" ]; then
          sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
        fi

    - name: Restore Download Cache
      if: env.ENABLE_DL_CACHE == 'true'
      uses: actions/cache@v5
      with:
        path: openwrt/dl
        key: dl-v2-${{ env.WRT_VER }}-${{ env.WRT_TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          dl-v2-${{ env.WRT_VER }}-${{ env.WRT_TARGET }}-

    - name: Restore Compiler Cache
      if: env.ENABLE_CCACHE == 'true'
      uses: actions/cache@v5
      with:
        path: openwrt/.ccache
        key: ccache-v3-${{ env.RUNNER_OS_VERSION }}-${{ runner.arch }}-${{ env.WRT_VER }}-${{ env.WRT_TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ccache-v3-${{ env.RUNNER_OS_VERSION }}-${{ runner.arch }}-${{ env.WRT_VER }}-${{ env.WRT_TARGET }}-

    - name: Configure Compiler Cache
      if: env.ENABLE_CCACHE == 'true'
      run: |
        export CCACHE_DIR="$GITHUB_WORKSPACE/openwrt/.ccache"
        export CCACHE_MAXSIZE="$CCACHE_SIZE"
        export CCACHE_COMPILERCHECK=content

        mkdir -p "$CCACHE_DIR"

        ccache --max-size="$CCACHE_SIZE"
        ccache --zero-stats

        {
          echo "CCACHE_DIR=$CCACHE_DIR"
          echo "CCACHE_MAXSIZE=$CCACHE_MAXSIZE"
          echo "CCACHE_COMPILERCHECK=$CCACHE_COMPILERCHECK"
        } >> "$GITHUB_ENV"

        echo "===== ccache version ====="
        ccache --version

        echo "===== ccache configuration ====="
        ccache --show-config

    - name: Update Feeds
      run: |
        cd ./openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      env:
        REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      run: |
        set -e
        git clone --depth=1 https://x-access-token:$REPO_TOKEN@github.com/pirately/OpenWrt_Files
        cp -f OpenWrt_Files/diy/banner openwrt/package/base-files/files/etc/banner
        sed -i "s/%D %V, %C/OpenWrt by Jeffen ${WRT_TIME}/g" openwrt/package/base-files/files/etc/banner
        cp -rf OpenWrt_Files/diy/* ./ && rm -rf ./banner
        cp -f OpenWrt_Files/scripts/diy.sh "$GITHUB_WORKSPACE/scripts"
        cp -rf "OpenWrt_Files/${WRT_PLUGIN}"/* ./ && rm -rf OpenWrt_Files
        
        if [ -d files ]; then
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
        fi
        if [[ "$ENABLE_ADGUARDHOME" != true ]]; then
          rm -rf openwrt/files/etc/adguardhome openwrt/files/etc/config/adguardhome
        fi

        find ./ -maxdepth 3 -type f -iregex ".*\(config\|sh\)$" -exec sed -i 's/\r//' {} \; -exec chmod +x {} \;

    - name: Custom Settings
      run: |
        cd ./openwrt/package/
        "$GITHUB_WORKSPACE/scripts/packages.sh"
        "$GITHUB_WORKSPACE/scripts/handles.sh"

        cd ../
        cat "$GITHUB_WORKSPACE/config/${WRT_TARGET}.config" "$GITHUB_WORKSPACE/config/general.config" >> .config
        "$GITHUB_WORKSPACE/scripts/settings.sh"
        "$GITHUB_WORKSPACE/scripts/diy.sh"
        "$GITHUB_WORKSPACE/scripts/diy_op.sh"

        # 移除已有的 ccache 配置，避免重复定义
        sed -i -E '/^(CONFIG_CCACHE=|# CONFIG_CCACHE is not set|CONFIG_CCACHE_DIR=|# CONFIG_CCACHE_DIR is not set)/d' .config

        if [[ "$ENABLE_CCACHE" == true ]]; then
          sed -i -E '/^(CONFIG_DEVEL=|# CONFIG_DEVEL is not set)/d' .config

          {
            echo "CONFIG_DEVEL=y"
            echo "CONFIG_CCACHE=y"
            echo "CONFIG_CCACHE_DIR=\"$CCACHE_DIR\""
          } >> .config
        else
          echo "# CONFIG_CCACHE is not set" >> .config
        fi

        make defconfig -j$(nproc)

        # 检查最终配置
        echo "===== Final ccache configuration ====="
        grep -E '^(CONFIG_DEVEL=|CONFIG_CCACHE=|CONFIG_CCACHE_DIR=|# CONFIG_CCACHE is not set)' .config || true

        if [[ "$ENABLE_CCACHE" == true ]]; then
          if ! grep -qx 'CONFIG_CCACHE=y' .config; then
            echo "::error::CONFIG_CCACHE was disabled after make defconfig"
            exit 1
          fi

          if ! grep -Fxq "CONFIG_CCACHE_DIR=\"$CCACHE_DIR\"" .config; then
            echo "::error::Unexpected CONFIG_CCACHE_DIR"
            exit 1
          fi

          echo "ccache is enabled successfully."
        fi

    - name: Fix Rust CI LLVM download error
      shell: bash
      run: |
        set -Eeuo pipefail
        cd openwrt

        RUST_MAKEFILE="feeds/packages/lang/rust/Makefile"
        if [[ ! -f "$RUST_MAKEFILE" ]]; then
          echo "Rust package Makefile not present in this feed snapshot; no patch needed."
          exit 0
        fi

        echo "===== Rust Makefile before patch ====="
        grep -nE 'download-ci-llvm|x.py' "$RUST_MAKEFILE" || true

        # Avoid stale/missing Rust CI LLVM artifacts (common HTTP 404 failure).
        sed -i -E \
          -e 's/--set=llvm\.download-ci-llvm=(true|if-unchanged)/--set=llvm.download-ci-llvm=false/g' \
          -e 's/download-ci-llvm[[:space:]]*=[[:space:]]*true/download-ci-llvm = false/g' \
          "$RUST_MAKEFILE"

        if grep -qE -- '--set=llvm\.download-ci-llvm=(true|if-unchanged)|download-ci-llvm[[:space:]]*=[[:space:]]*true' "$RUST_MAKEFILE"; then
          echo "Rust LLVM CI download option remains enabled; aborting." >&2
          exit 1
        fi

        if grep -q -- '--set=llvm.download-ci-llvm=false' "$RUST_MAKEFILE"; then
          echo "Rust LLVM CI download disabled."
        else
          echo "No matching option found; leaving upstream Makefile unchanged."
        fi
        echo "===== Rust Makefile after patch ====="
        grep -nE 'download-ci-llvm|x.py' "$RUST_MAKEFILE" || true

    - name: Download Packages
      run: |
        cd ./openwrt
        make download -j$(nproc)
        find dl -type f -empty -print -delete

    - name: Compile the firmware
      id: compile
      run: |
        cd ./openwrt
        echo -e "$(nproc) thread compile"
        if ! (make -j$(nproc) || make -j1 V=s &>build.log); then
          tail -50 build.log

          # 提取关键错误日志并存入多行环境变量，供后续统一推送步骤使用
          KEY_ERRORS=$(grep -iE "error:|failed" build.log | tail -n 10 || true)
          TAIL_LOG=$(tail -n 10 build.log)
          {
            echo "ERROR_LOG<<EOF"
            echo "${KEY_ERRORS}"
            echo "--- 末尾日志 ---"
            echo "${TAIL_LOG}"
            echo "EOF"
          } >> $GITHUB_ENV

          exit 1
        fi

        echo "status=success" >> $GITHUB_OUTPUT

    - name: Cache Statistics
      if: always() && env.ENABLE_CCACHE == 'true'
      run: |
        echo "===== Final build configuration ====="
        grep -E '^CONFIG_(DEVEL|CCACHE|CCACHE_DIR)=' openwrt/.config || true

        echo "===== System ccache statistics ====="
        ccache --show-stats || true

        echo "===== OpenWrt ccache statistics ====="
        if [[ -x openwrt/staging_dir/host/bin/ccache ]]; then
          openwrt/staging_dir/host/bin/ccache --version
          openwrt/staging_dir/host/bin/ccache -s || true
        fi

        echo "===== Cache directory size ====="
        du -sh openwrt/dl openwrt/.ccache || true

        echo "===== Cache file count ====="
        if [[ -d openwrt/.ccache ]]; then
          find openwrt/.ccache -type f | wc -l
        fi

        echo "===== Other possible ccache directories ====="
        find openwrt "$HOME/.cache" -type d \
          -name '.ccache' -print 2>/dev/null || true

    - name: Machine Information
      if: always()
      run: |
        echo "======================="
        lscpu | grep -E "name|Core|Thread"
        echo "======================="
        df -h
        echo "======================="

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd ./openwrt && mkdir -p ./upload
        cp -f ./.config ./upload/Config_"${WRT_VER}(${WRT_PLUGIN})_${WRT_DATE}".config
        KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)
        find ./bin/targets/ -iregex ".*\(buildinfo\|json\|manifest\|sha256sums\|packages\|bin\|rootfs.img.gz\|combined.img.gz\|targz-rootfs.tar.gz\)$" -exec rm -rf {} +

        for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TYPE*") ; do
          EXT=$(basename "$FILE" | cut -d '.' -f 2-)
          NAME=$(basename "$FILE" | cut -d '.' -f 1 | grep -io "\($WRT_TYPE\).*")
          NEW_FILE="${WRT_VER}_${NAME}_${WRT_DATE}.${EXT}"
          mv -f "$FILE" "./upload/$NEW_FILE"
        done

        find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;
        echo "WRT_KVER=${KVER:-none}" >> $GITHUB_ENV
        echo "FIRMWARE=$PWD/upload" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.WRT_VER }}(${{ env.WRT_PLUGIN }})_${{ env.WRT_DATE }}
        path: ${{ env.FIRMWARE }}
        compression-level: 0
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        if-no-files-found: error

    - name: Generate Release
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        printf "1、源码：%s\n2、分支：%s\n3、设备：%s\n4、内核：%s\n-- Build by Jeffen with Github Actions on %s for %s device\n" \
          "${{ env.WRT_REPO }}" "${{ env.WRT_BRANCH }}" "${{ env.WRT_TARGET }}" "${{ env.WRT_KVER }}" "${{ env.WRT_DATE }}" "${{ env.WRT_TARGET }}" > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Release
      uses: softprops/action-gh-release@master
      if: env.UPLOAD_RELEASE == 'true' && steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.WRT_VER }}_${{ env.WRT_TARGET }}_${{ env.WRT_DATE }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Push Information Notice
      if: always() && env.INFORMATION_NOTICE == 'true' && !cancelled()
      env:
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        COMPILE_STATUS: ${{ steps.compile.outcome }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        if [[ -z "$WXPUSHER_SPT" ]]; then
          echo "WXPUSHER_SPT 未配置，跳过推送"
          exit 0
        fi

        NOW_TIME=$(date +%Y年%m月%d日%H时%M分)

        if [[ "$COMPILE_STATUS" == 'success' ]]; then
          SUMMARY="✌️【${WRT_SOURCE}】编译成功"
          CONTENT=$(printf "我亲爱的✨主人✨：您编译的【%s】固件顺利编译完成了✌️💯💐\n\n🎄源码：%s\n\n💕分支：【%s】\n\n😋设备：【%s】\n\n🔑内核：【%s】\n\n🎉插件：【%s】\n\n📯仓库号码：【#%s号】\n\n🕗编译时间：(%s)" \
            "$WRT_SOURCE" "$WRT_REPO" "$WRT_BRANCH" "$WRT_TARGET" "${WRT_KVER:-none}" "$WRT_PLUGIN" "$RUN_NUMBER" "$NOW_TIME")
        else
          SUMMARY="❌【${WRT_SOURCE}】编译失败"
          CONTENT=$(printf "我亲爱的✨主人✨：您编译的【%s】固件失败了✌️💯💐\n\n🎄源码：%s\n\n💕分支：【%s】\n\n😋设备：【%s】\n\n🎉插件：【%s】\n\n📯仓库号码：【#%s号】\n\n🕗编译时间：(%s)\n\n⚠️关键错误日志：\n%s" \
            "$WRT_SOURCE" "$WRT_REPO" "$WRT_BRANCH" "$WRT_TARGET" "$WRT_PLUGIN" "$RUN_NUMBER" "$NOW_TIME" "${ERROR_LOG:-未捕获到详细错误日志，请前往 Actions 页面查看}")
        fi

        JSON_DATA=$(jq -n \
          --arg spt "$WXPUSHER_SPT" \
          --arg summary "$SUMMARY" \
          --arg content "$CONTENT" \
          '{spt: $spt, summary: $summary, content: $content, contentType: 1}')

        curl -s -X POST "https://wxpusher.zjiecode.com/api/send/message/simple-push" \
          -H "Content-Type: application/json" \
          -d "$JSON_DATA"

    - name: Cleanup old workflow runs and releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 保留最近 3 次运行记录，删除更早的记录
        gh run list --workflow="Build_OpenWrt" --status completed --limit 100 --json databaseId -q '.[3:][].databaseId' | while read -r RUN_ID; do
          if [[ "$RUN_ID" != "${{ github.run_id }}" ]]; then
            gh run delete "$RUN_ID" || true
          fi
        done

        # 如果开启了 Release，保留最近 3 个 Release 及对应 Tag，删除更早的
        if [[ "${{ env.UPLOAD_RELEASE }}" == "true" ]]; then
          gh release list --limit 100 --json tagName -q '.[3:][].tagName' | while read -r TAG; do
            gh release delete "$TAG" --yes --cleanup-tag || true
          done
        fi
