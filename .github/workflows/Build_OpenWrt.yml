name: Build_OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:

concurrency:
  group: build-openwrt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
    - name: Checkout Projects
      uses: actions/checkout@main

      with:
        persist-credentials: false

    - name: Load Settings.ini
      run: |
        source "${GITHUB_WORKSPACE}/settings/settings.ini"
        {
          echo "WRT_REPO=${WRT_REPO}"
          echo "WRT_BRANCH=${WRT_BRANCH}"
          echo "WRT_TARGET=${WRT_TARGET}"
          echo "WRT_THEME=${WRT_THEME}"
          echo "WRT_NAME=${WRT_NAME}"
          echo "WRT_PLUGIN=${WRT_PLUGIN}"
          echo "UPLOAD_FIRMWARE=${UPLOAD_FIRMWARE}"
          echo "UPLOAD_RELEASE=${UPLOAD_RELEASE}"
          echo "INFORMATION_NOTICE=${INFORMATION_NOTICE}"
          echo "ENABLE_ADGUARDHOME=$ENABLE_ADGUARDHOME"
          echo "ENABLE_DL_CACHE=${ENABLE_DL_CACHE}"
          echo "ENABLE_CCACHE=${ENABLE_CCACHE}"
          echo "CCACHE_SIZE=${CCACHE_SIZE}"
          echo "ENABLE_GO_CACHE=${ENABLE_GO_CACHE:-true}"
          echo "ENABLE_TOOLCHAIN_CACHE=${ENABLE_TOOLCHAIN_CACHE:-false}"
          echo "ARTIFACT_RETENTION_DAYS=${ARTIFACT_RETENTION_DAYS}"
        } >> $GITHUB_ENV

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 清理 Runner 预装的大体积冗余软件，释放 15GB+ 空间防止编译爆盘
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/*
        sudo apt-get -yqq update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential bzip2 ca-certificates ccache clang \
          cmake cpio curl device-tree-compiler dos2unix file flex \
          g++-multilib gawk gcc-multilib genisoimage gettext git jq \
          libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
          llvm ninja-build patch perl pkgconf python3 python3-cryptography \
          python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
          unzip wget xz-utils zlib1g-dev zstd

        sudo apt-get -yqq autoremove --purge && sudo apt-get -yqq clean
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Initialization Values
      run: |
        WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M")
        WRT_TIME=$(TZ=UTC-8 date +%Y.%m.%d)
        WRT_SOURCE=$(echo "$WRT_REPO" | cut -d '/' -f 5-)
        WRT_VER="${WRT_SOURCE}-${WRT_BRANCH}"
        WRT_TYPE=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "./config/${WRT_TARGET}.config" | tr '[:lower:]' '[:upper:]')

        {
          echo "WRT_DATE=$WRT_DATE"
          echo "WRT_TIME=$WRT_TIME"
          echo "WRT_SOURCE=$WRT_SOURCE"
          echo "WRT_VER=$WRT_VER"
          echo "WRT_TYPE=$WRT_TYPE"
          echo "RUNNER_OS_VERSION=$( . /etc/os-release; printf '%s-%s' "$ID" "$VERSION_ID")"
        } >> "$GITHUB_ENV"

    - name: Clone Source Code
      run: |
        git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./openwrt

        cd ./openwrt/
        echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

        # 移除国内镜像源，避免 GitHub 服务器拉取超时
        PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
        if [ -f "$PROJECT_MIRRORS_FILE" ]; then
          sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
        fi

    - name: Restore Download Cache
      id: dl_cache
      if: env.ENABLE_DL_CACHE == 'true'
      uses: actions/cache/restore@v5
      with:
        path: openwrt/dl
        key: dl-${{ env.WRT_VER }}-${{ env.WRT_TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          dl-${{ env.WRT_VER }}-${{ env.WRT_TARGET }}-

    - name: Restore Compiler Cache
      id: compiler_cache
      if: env.ENABLE_CCACHE == 'true'
      uses: actions/cache/restore@v5
      with:
        path: openwrt/.ccache
        key: ccache-${{ runner.arch }}-${{ env.WRT_VER }}-${{ env.WRT_TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ccache-${{ runner.arch }}-${{ env.WRT_VER }}-${{ env.WRT_TARGET }}-
          ccache-${{ env.RUNNER_OS_VERSION }}-${{ runner.arch }}-${{ env.WRT_VER }}-${{ env.WRT_TARGET }}-

    - name: Configure Compiler Cache
      if: env.ENABLE_CCACHE == 'true'
      run: |
        export CCACHE_DIR="$GITHUB_WORKSPACE/openwrt/.ccache"
        mkdir -p "$CCACHE_DIR"
        export CCACHE_COMPILERCHECK=content
        echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
        ccache --max-size="$CCACHE_SIZE"
        ccache --zero-stats
        echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"

    - name: Update Feeds
      run: |
        cd ./openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      env:
        REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      run: |
        set -e
        git clone --depth=1 https://x-access-token:$REPO_TOKEN@github.com/pirately/OpenWrt_Files
        cp -f OpenWrt_Files/diy/banner openwrt/package/base-files/files/etc/banner
        sed -i "s/%D %V, %C/OpenWrt by Jeffen ${WRT_TIME}/g" openwrt/package/base-files/files/etc/banner
        cp -rf OpenWrt_Files/diy/* ./ && rm -rf ./banner
        cp -f OpenWrt_Files/scripts/diy.sh "$GITHUB_WORKSPACE/scripts"
        cp -rf "OpenWrt_Files/${WRT_PLUGIN}"/* ./ && rm -rf OpenWrt_Files
        
        if [ -d files ]; then
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
        fi
        if [[ "$ENABLE_ADGUARDHOME" != true ]]; then
          rm -rf openwrt/files/etc/adguardhome openwrt/files/etc/config/adguardhome
        fi

        find ./ -maxdepth 3 -type f -iregex ".*\(config\|sh\)$" -exec sed -i 's/\r//' {} \; -exec chmod +x {} \;

    - name: Custom Settings
      run: |
        cd ./openwrt/package/
        "$GITHUB_WORKSPACE/scripts/packages.sh"
        "$GITHUB_WORKSPACE/scripts/handles.sh"

        cd ../
        cat "$GITHUB_WORKSPACE/config/${WRT_TARGET}.config" "$GITHUB_WORKSPACE/config/general.config" >> .config
        "$GITHUB_WORKSPACE/scripts/settings.sh"
        "$GITHUB_WORKSPACE/scripts/diy.sh"
        "$GITHUB_WORKSPACE/scripts/diy_op.sh"

        # 移除已有的 ccache 配置，避免重复定义
        sed -i -E '/^(CONFIG_CCACHE=|# CONFIG_CCACHE is not set|CONFIG_CCACHE_DIR=|# CONFIG_CCACHE_DIR is not set)/d' .config
        if [[ "$ENABLE_CCACHE" == true ]]; then
          sed -i -E '/^(CONFIG_DEVEL=|# CONFIG_DEVEL is not set)/d' .config
          printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\nCONFIG_CCACHE_DIR="%s"\n' "$CCACHE_DIR" >> .config
        else
          echo "# CONFIG_CCACHE is not set" >> .config
        fi
        make defconfig -j$(nproc)
        if [[ "$ENABLE_CCACHE" == true ]]; then
          grep -qx CONFIG_CCACHE=y .config
          grep -Fx "CONFIG_CCACHE_DIR=\"$CCACHE_DIR\"" .config
        fi
        grep -Ei '^CONFIG_PACKAGE_.*(rust|llvm).*=[ym]' .config || true

    - name: Check and Fix Rust CI LLVM
      run: |
        cd ./openwrt

        RUST_MAKEFILE="feeds/packages/lang/rust/Makefile"

        echo "===== Rust configuration ====="

        if [[ ! -f "$RUST_MAKEFILE" ]]; then
          echo "Rust Makefile not found, skipping."
          exit 0
        fi

        grep -E '^PKG_VERSION:=' "$RUST_MAKEFILE" || true

        echo "===== Selected Rust related packages ====="

        grep -Ei '^CONFIG_PACKAGE_.*(rust|llvm).*=[ym]' \
          .config || true

        echo "===== Rust LLVM configuration ====="

        if grep -qF -- \
          '--set=llvm.download-ci-llvm=true' "$RUST_MAKEFILE"; then

          echo "Upstream uses CI LLVM download, applying fix."

          sed -i \
            's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/g' \
            "$RUST_MAKEFILE"

        elif grep -qF -- \
          '--set=llvm.download-ci-llvm=false' "$RUST_MAKEFILE"; then

          echo "Upstream already disables CI LLVM download."

        else
          echo "No matching LLVM configuration, keeping upstream unchanged."
        fi

        echo "===== Final Rust LLVM configuration ====="

        grep -nF 'llvm.download-ci-llvm' \
          "$RUST_MAKEFILE" || true

    - name: Prepare Build Cache Keys
      run: |
        cd openwrt
        BUILD_FINGERPRINT=$({
          git rev-parse HEAD
          git diff HEAD -- tools toolchain include scripts target rules.mk Makefile config
          find tools toolchain include scripts target config -type f -print0 | sort -z | xargs -0 -r sha256sum
          # 只校验架构、内核和工具链配置，增减普通插件不影响缓存命中
          grep -E '^CONFIG_(TARGET|TOOLCHAIN|GCC|LIBC|KERNEL|USE_MUSL|USE_GLIBC)' .config | sort
          dpkg-query -W -f='${Package} ${Version}\n' | LC_ALL=C sort
          printf '%s\n' "${ImageVersion:-unknown}"
        } | sha256sum | cut -d ' ' -f1)
        echo "BUILD_FINGERPRINT=$BUILD_FINGERPRINT" >> "$GITHUB_ENV"
        
        # Verify actual feed definitions before enabling Go cache; skip unknown layouts.
        GO_MK=feeds/packages/lang/golang/golang-values.mk
        if [[ "$ENABLE_GO_CACHE" == true && -f "$GO_MK" ]] &&           grep -Fq '$(TMP_DIR)/go-build' "$GO_MK" && grep -Fq '$(DL_DIR)/go-mod-cache' "$GO_MK" && ! grep -Eq '^CONFIG_GOLANG_BUILD_CACHE_DIR="[^" ]+"' .config; then
          echo "GO_CACHE_READY=true" >> "$GITHUB_ENV"
        else
          echo "GO_CACHE_READY=false" >> "$GITHUB_ENV"
        fi
        grep -nE 'GO_BUILD_CACHE_DIR|GO_MOD_CACHE_DIR' "$GO_MK" || true

    - name: Restore Go Cache
      id: go_cache
      if: env.GO_CACHE_READY == 'true'
      uses: actions/cache/restore@v5
      with:
        path: openwrt/tmp/go-build
        key: go-${{ runner.arch }}-${{ env.WRT_VER }}-${{ env.WRT_TARGET }}-${{ env.BUILD_FINGERPRINT }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          go-${{ runner.arch }}-${{ env.WRT_VER }}-${{ env.WRT_TARGET }}-${{ env.BUILD_FINGERPRINT }}-

    - name: Restore Toolchain Cache
      id: toolchain_cache
      if: env.ENABLE_TOOLCHAIN_CACHE == 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          openwrt/staging_dir/host
          openwrt/staging_dir/toolchain-*
        key: toolchain-${{ env.RUNNER_OS_VERSION }}-${{ runner.arch }}-${{ env.WRT_TARGET }}-${{ env.BUILD_FINGERPRINT }}

    - name: Download Packages
      run: |
        cd ./openwrt
        make download -j$(nproc)
        find dl -type f -empty -print -delete

    - name: Compile the firmware
      id: compile
      shell: bash
      run: |
        set -o pipefail
        cd openwrt
        START=$(date +%s)
        (while sleep 300; do
          echo "===== Build heartbeat $(date -Is) ====="
          free -h; df -h .; uptime
        done) &
        HEARTBEAT=$!
        trap 'kill "$HEARTBEAT" 2>/dev/null || true; echo "BUILD_SECONDS=$(($(date +%s)-START))" >> "$GITHUB_ENV"' EXIT
        phase() {
          local label=$1 start rc=0
          shift
          start=$(date +%s)
          echo "::group::$label"
          make -j"$(nproc)" "$@" 2>&1 | tee "build-${label}.log" || rc=$?
          if (( rc != 0 )); then
            make -j1 V=s "$@" 2>&1 | tee "build-${label}-retry.log" || {
              { echo 'ERROR_LOG<<BUILD_ERROR'; tail -n 30 "build-${label}-retry.log" | cut -c1-180; echo BUILD_ERROR; } >> "$GITHUB_ENV"
              echo '::endgroup::'
              return 1
            }
          fi
          echo '::endgroup::'
          printf '%s: %s seconds\n' "$label" "$(($(date +%s)-start))" | tee -a "$GITHUB_STEP_SUMMARY"
        }
        phase tools tools/install
        phase toolchain toolchain/install
        phase target target/compile
        phase packages package/compile
        phase firmware

        echo "status=success" >> $GITHUB_OUTPUT

    - name: Cache Statistics
      if: always() && env.ENABLE_CCACHE == 'true'
      run: |
        ccache --show-stats || true
        HIT=$(ccache --show-stats | awk '/^[[:space:]]*Hits:/ {print $NF; exit}' | tr -d '()')
        echo "CCACHE_HIT_RATE=${HIT:-unknown}" >> "$GITHUB_ENV"
        du -sh openwrt/dl openwrt/.ccache openwrt/tmp/go-build openwrt/dl/go-mod-cache openwrt/staging_dir/host openwrt/staging_dir/toolchain-* openwrt/build_dir/host openwrt/build_dir/toolchain-* 2>/dev/null || true

    - name: Save Download Cache
      if: steps.compile.outcome == 'success' && env.ENABLE_DL_CACHE == 'true' && steps.dl_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: openwrt/dl
        key: ${{ steps.dl_cache.outputs.cache-primary-key }}

    - name: Save Compiler Cache
      if: steps.compile.outcome == 'success' && env.ENABLE_CCACHE == 'true' && steps.compiler_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: openwrt/.ccache
        key: ${{ steps.compiler_cache.outputs.cache-primary-key }}

    - name: Save Go Cache
      if: steps.compile.outcome == 'success' && env.GO_CACHE_READY == 'true' && steps.go_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: openwrt/tmp/go-build
        key: ${{ steps.go_cache.outputs.cache-primary-key }}

    - name: Save Toolchain Cache
      if: steps.compile.outcome == 'success' && env.ENABLE_TOOLCHAIN_CACHE == 'true' && steps.toolchain_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: |
          openwrt/staging_dir/host
          openwrt/staging_dir/toolchain-*
        key: ${{ steps.toolchain_cache.outputs.cache-primary-key }}

    - name: Cleanup old build caches
      if: steps.compile.outcome == 'success' && !cancelled()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cleanup_cache() {
          local prefix="$1"
          local keep="$2"

          gh cache list \
            --ref "$GITHUB_REF" \
            --key "$prefix" \
            --limit 100 \
            --sort created_at \
            --order desc \
            --json id,key,createdAt |
          jq -r --arg prefix "$prefix" --argjson keep "$keep" \
            'map(select(.key | startswith($prefix))) | .[$keep:] | .[].id' |
          while read -r CACHE_ID; do
            echo "Deleting old cache: $CACHE_ID"
            gh cache delete "$CACHE_ID" || true
          done
        }

        cleanup_cache "dl-${WRT_VER}-${WRT_TARGET}-" 1
        cleanup_cache "ccache-${RUNNER_ARCH}-${WRT_VER}-${WRT_TARGET}-" 1
        cleanup_cache "go-${RUNNER_ARCH}-${WRT_VER}-${WRT_TARGET}-" 1
        cleanup_cache "toolchain-${RUNNER_OS_VERSION}-${RUNNER_ARCH}-${WRT_TARGET}-" 2

    - name: Machine Information
      if: always()
      run: |
        echo "======================="
        lscpu | grep -E "name|Core|Thread"
        echo "======================="
        df -h
        echo "======================="

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd ./openwrt && mkdir -p ./upload
        cp -f ./.config ./upload/Config_"${WRT_VER}(${WRT_PLUGIN})_${WRT_DATE}".config
        KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)
        find ./bin/targets/ -iregex ".*\(buildinfo\|json\|manifest\|sha256sums\|packages\|bin\|rootfs.img.gz\|combined.img.gz\|targz-rootfs.tar.gz\)$" -exec rm -rf {} +

        for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TYPE*") ; do
          EXT=$(basename "$FILE" | cut -d '.' -f 2-)
          NAME=$(basename "$FILE" | cut -d '.' -f 1 | grep -io "\($WRT_TYPE\).*")
          NEW_FILE="${WRT_VER}_${NAME}_${WRT_DATE}.${EXT}"
          mv -f "$FILE" "./upload/$NEW_FILE"
        done

        find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;
        echo "WRT_KVER=${KVER:-none}" >> $GITHUB_ENV
        echo "FIRMWARE=$PWD/upload" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.WRT_VER }}(${{ env.WRT_PLUGIN }})_${{ env.WRT_DATE }}
        path: ${{ env.FIRMWARE }}
        compression-level: 0
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
        if-no-files-found: error

    - name: Generate Release
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        printf "1、源码：%s\n2、分支：%s\n3、设备：%s\n4、内核：%s\n-- Build by Jeffen with Github Actions on %s for %s device\n" \
          "${{ env.WRT_REPO }}" "${{ env.WRT_BRANCH }}" "${{ env.WRT_TARGET }}" "${{ env.WRT_KVER }}" "${{ env.WRT_DATE }}" "${{ env.WRT_TARGET }}" > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Release
      uses: softprops/action-gh-release@master
      if: env.UPLOAD_RELEASE == 'true' && steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.WRT_VER }}_${{ env.WRT_TARGET }}_${{ env.WRT_DATE }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Push Information Notice
      if: always() && env.INFORMATION_NOTICE == 'true' && !cancelled()
      continue-on-error: true
      env:
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        COMPILE_STATUS: ${{ steps.compile.outcome }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        if [[ -z "$WXPUSHER_SPT" ]]; then
          echo "WXPUSHER_SPT 未配置，跳过推送"
          exit 0
        fi

        NOW_TIME=$(date +%Y年%m月%d日%H时%M分)

        if [[ "$COMPILE_STATUS" == 'success' ]]; then
          SUMMARY="✌️【${WRT_SOURCE}】编译成功"
          CONTENT=$(printf "我亲爱的✨主人✨：您编译的【%s】固件顺利编译完成了✌️💯💐\n\n🎄源码：%s\n\n💕分支：【%s】\n\n😋设备：【%s】\n\n🔑内核：【%s】\n\n🎉插件：【%s】\n\n📯仓库号码：【#%s号】\n\n🕗编译时间：(%s)" \
            "$WRT_SOURCE" "$WRT_REPO" "$WRT_BRANCH" "$WRT_TARGET" "${WRT_KVER:-none}" "$WRT_PLUGIN" "$RUN_NUMBER" "$NOW_TIME")
        else
          SUMMARY="❌【${WRT_SOURCE}】编译失败"
          CONTENT=$(printf "我亲爱的✨主人✨：您编译的【%s】固件失败了✌️💯💐\n\n🎄源码：%s\n\n💕分支：【%s】\n\n😋设备：【%s】\n\n🎉插件：【%s】\n\n📯仓库号码：【#%s号】\n\n🕗编译时间：(%s)\n\n⚠️关键错误日志：\n%s" \
            "$WRT_SOURCE" "$WRT_REPO" "$WRT_BRANCH" "$WRT_TARGET" "$WRT_PLUGIN" "$RUN_NUMBER" "$NOW_TIME" "${ERROR_LOG:-未捕获到详细错误日志，请前往 Actions 页面查看}")
        fi

        SECONDS_TOTAL=${BUILD_SECONDS:-0}
        CONTENT+=$(printf '\n\n⏱️编译耗时：%s小时%s分钟\n\n📦ccache 命中率：%s' "$((SECONDS_TOTAL/3600))" "$((SECONDS_TOTAL%3600/60))" "${CCACHE_HIT_RATE:-未知}")

        JSON_DATA=$(jq -n \
          --arg spt "$WXPUSHER_SPT" \
          --arg summary "$SUMMARY" \
          --arg content "$CONTENT" \
          '{spt: $spt, summary: $summary, content: $content, contentType: 1}')

        curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -X POST "https://wxpusher.zjiecode.com/api/send/message/simple-push" \
          -H "Content-Type: application/json" \
          -d "$JSON_DATA"

    - name: Cleanup old workflow runs and releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 保留最近 3 次运行记录，删除更早的记录
        gh run list --workflow="Build_OpenWrt" --status completed --limit 100 --json databaseId -q '.[3:][].databaseId' | while read -r RUN_ID; do
          if [[ "$RUN_ID" != "${{ github.run_id }}" ]]; then
            gh run delete "$RUN_ID" || true
          fi
        done

        # 如果开启了 Release，保留最近 3 个 Release 及对应 Tag，删除更早的
        if [[ "${{ env.UPLOAD_RELEASE }}" == "true" ]]; then
          gh release list --limit 100 --json tagName -q '.[3:][].tagName' | while read -r TAG; do
            gh release delete "$TAG" --yes --cleanup-tag || true
          done
        fi
